org.gradle.caching=true
org.gradle.configuration-cache=true

# Setting jvmargs replaces Gradle's defaults, so all memory settings must be listed here.
# The memory settings are Gradle's own defaults; UTF-8 makes file encoding independent of the machine's locale.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
