name: Testing
on: [push]

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
        contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Configure Java"
        uses: actions/setup-java@v6.2.0
        with:
          java-version-file: ".sdkmanrc"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"

      - name: "Gradle - Tests"
        run: ./gradlew test --no-watch-fs --parallel --stacktrace --max-workers=4


